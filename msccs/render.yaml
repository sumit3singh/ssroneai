# Render Infrastructure as Code (render.yaml)
# Deploy SSR ONE AI M.Sc. Computer Science Academic Portal to Render (render.com)

services:
  # ---------------------------------------------------------------------------
  # 🚀 Primary Service: Static Web App (100% Free, Global CDN, Zero Cold Starts)
  # ---------------------------------------------------------------------------
  - type: web
    name: msccs-portfolio
    runtime: static
    buildCommand: ""
    staticPublishPath: app
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
