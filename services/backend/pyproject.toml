[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ssr-one-ai-backend"
version = "1.0.0"
description = "SSR One AI Backend Core Services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.31.0",
    "alembic>=1.13.3",
    "psycopg2-binary>=2.9.12",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "cryptography>=43.0.1",
    "redis>=5.1.1",
    "celery[redis]>=5.4.0",
    "httpx>=0.27.2",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP", "B", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401"]
exclude = ["migrations/", ".venv/", "__pycache__/"]

[tool.ruff.per-file-ignores]
"tests/*" = ["ANN", "S"]

[tool.black]
line-length = 100
target-version = ["py312"]
exclude = '''
/(
    migrations
  | .venv
  | __pycache__
)/
'''

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["migrations/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src"]
omit = ["*/migrations/*", "*/tests/*"]
