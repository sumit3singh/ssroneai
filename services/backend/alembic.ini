[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Default connection for alembic offline/CLI mode (overridden dynamically in migrations/env.py by DATABASE_URL)
sqlalchemy.url = postgresql+asyncpg://neondb_owner:npg_Nx0sXMZqRF6c@ep-solitary-snow-b55t825b-pooler.c-7.us-east-2.aws.neon.tech:5432/neondb?ssl=require

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = [sys.stderr]
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
