version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ssr_one_ai_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ssr_one_ai_redis_prod
    restart: always
    volumes:
      - redis_prod_data:/data

  backend:
    build:
      context: ../../services/backend
      dockerfile: Dockerfile
    container_name: ssr_one_ai_backend_prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379

volumes:
  postgres_prod_data:
  redis_prod_data:
