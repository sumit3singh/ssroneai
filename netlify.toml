# Netlify Configuration for SSR One AI Monorepo
# Default site build target: @ssrone/admin-web

[build]
  command = "pnpm --filter @ssrone/admin-web build"
  publish = "apps/admin-web/dist"

[build.environment]
  NODE_VERSION = "20"
  PNPM_FLAGS = "--no-frozen-lockfile"

# Fallback rewrite for client-side SPA routing (TanStack Router / React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
