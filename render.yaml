# Render Deployment Blueprint for SSR One AI
services:
  - type: web
    name: customer-food-web
    runtime: static
    buildCommand: npm install -g pnpm && pnpm install --no-frozen-lockfile && pnpm --filter @ssrone/customer-food-web build
    staticPublishPath: ./apps/customer-food-web/dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://ssrone-backend.onrender.com/api/v1
      - key: NODE_VERSION
        value: 20
